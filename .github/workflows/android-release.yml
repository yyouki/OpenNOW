name: Android Release

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 2.4.1-redmi14c.1
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Android release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release version
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == android-v* ]]; then
            version="${REF_NAME#android-v}"
          else
            echo "Provide a version or push an android-v* tag." >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if [[ -n "$INPUT_PRERELEASE" ]]; then
            prerelease="$INPUT_PRERELEASE"
          elif [[ "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          # AGP 9.4 resolves compileSdk 37 through this compatibility directory.
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          yes | sdkmanager --licenses

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust dependencies and native build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/nvst/target
          key: ${{ runner.os }}-android-nvst-${{ hashFiles('android/nvst/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-nvst-

      - name: Run Android tests and build sideload release APK
        working-directory: android
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          chmod +x ./gradlew
          # Opus's pinned CMake source requires the project's supported 3.22 toolchain.
          export CMAKE="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -x "$CMAKE"
          ./gradlew --no-daemon --max-workers=2 --stacktrace \
            -PandroidReleaseVersion="$RELEASE_VERSION" \
            :app:testDebugUnitTest \
            :app:assembleRelease

      - name: Sign and verify sideload release APK
        id: sign
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$APK_DIR/app-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          KEYSTORE="$RUNNER_TEMP/opennow-release.keystore"
          test -s "$UNSIGNED_APK"

          if [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?Missing ANDROID_RELEASE_KEYSTORE_PASSWORD}"
            : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS}"
            STORE_PASSWORD="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_RELEASE_KEY_ALIAS"
            KEY_PASSWORD="${ANDROID_RELEASE_KEY_PASSWORD:-$ANDROID_RELEASE_KEYSTORE_PASSWORD}"
            SIGNING_MODE="persistent-keystore"
          else
            # Temporary signing is for testing only; it cannot update a differently signed install.
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="opennow-ci-test"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=OpenNOW CI Test"
            SIGNING_MODE="temporary-test-key"
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK" | tee android-release-signature.txt
          test -s "$SIGNED_APK"
          echo "signing_mode=$SIGNING_MODE" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes and checksums
        id: files
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SIGNING_MODE: ${{ steps.sign.outputs.signing_mode }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK" > android-release-sha256.txt
          {
            echo "# OpenNOW Android $VERSION"
            echo
            echo "- Source branch: `$GITHUB_REF_NAME`"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Version code: 195"
            echo "- Status bar: optional SSID and local device time"
            echo "- Region picker: provider-advertised routes ranked by bounded TCP-connect measurements"
            echo "- Live packet loss/jitter: active WebRTC or NVST transport statistics"
            echo "- Sideload APK signing: `$SIGNING_MODE`"
            echo "- APK SHA-256: `$(sha256sum "$APK" | cut -d ' ' -f 1)`"
            echo
            echo "The build runs Android unit tests and produces a signed sideload APK. Full Android lint runs separately in the Android Lint workflow to keep publishing independent of its long analysis time."
            if [[ "$SIGNING_MODE" == "temporary-test-key" ]]; then
              echo
              echo "This sideload APK uses a temporary CI key. It is suitable for a first test install, but a later build cannot update it unless a persistent keystore is configured in repository Actions secrets. Otherwise uninstall the old CI-signed APK before installing a newly signed one."
            fi
          } > android-release-notes.md
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opennow-android-release-${{ steps.meta.outputs.version }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android-release-sha256.txt
            android-release-signature.txt
            android-release-notes.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenNOW Android ${{ steps.meta.outputs.version }}
          body_path: android-release-notes.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android-release-sha256.txt
            android-release-signature.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
