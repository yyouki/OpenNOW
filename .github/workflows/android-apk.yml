name: Android APK

on:
  push:
    branches:
      - android-redmi14c
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          # API 37 is installed as android-37.0; AGP 9.4 resolves compileSdk 37 as android-37.
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi
          yes | sdkmanager --licenses

      - name: Set up Rust and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache Rust dependencies and native build outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/nvst/target
          key: ${{ runner.os }}-android-nvst-${{ hashFiles('android/nvst/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-nvst-

      - name: Run unit tests, lint, and build debug/release APKs
        working-directory: android
        run: |
          chmod +x ./gradlew
          # Pin CMake 3.22.1: the NVST Opus dependency uses legacy CMake policies removed in 4.x.
          export CMAKE="$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -x "$CMAKE"
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Sign release APK for sideloading
        id: sign-release
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/release"
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$APK_DIR/app-release.apk"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/37.0.0"
          KEYSTORE="$RUNNER_TEMP/opennow-release.keystore"

          test -s "$UNSIGNED_APK"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"

          if [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            : "${ANDROID_RELEASE_KEYSTORE_PASSWORD:?Missing ANDROID_RELEASE_KEYSTORE_PASSWORD secret}"
            : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS secret}"
            KEYSTORE_PASSWORD="$ANDROID_RELEASE_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_RELEASE_KEY_ALIAS"
            KEY_PASSWORD="${ANDROID_RELEASE_KEY_PASSWORD:-$ANDROID_RELEASE_KEYSTORE_PASSWORD}"
            echo "Release signing: persistent keystore secret"
          else
            # A temporary key keeps this build installable; it is not suitable for app updates.
            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS="opennow-ci-test"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=OpenNOW CI Test"
            {
              echo "### Release signing note"
              echo
              echo "This APK uses a temporary CI test key. To install a later build over it, configure a persistent Android release keystore using the ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS, and optional ANDROID_RELEASE_KEY_PASSWORD repository secrets. Without that, uninstall the prior CI-signed build before installing another."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"
          test -s "$SIGNED_APK"
          echo "release_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APKs and calculate checksums
        id: apk
        shell: bash
        run: |
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          sha256sum "$DEBUG_APK" "$RELEASE_APK" | tee android-apk-sha256.txt
          {
            echo "## Android APK builds"
            echo
            echo "| Variant | File | SHA-256 |"
            echo "| --- | --- | --- |"
            echo "| Debug | `app-debug.apk` | `$(sha256sum "$DEBUG_APK" | cut -d ' ' -f 1)` |"
            echo "| Release | `app-release.apk` | `$(sha256sum "$RELEASE_APK" | cut -d ' ' -f 1)` |"
            echo
            echo "Unit tests and Android lint completed before packaging."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: opennow-redmi14c-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android-apk-sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: opennow-redmi14c-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
